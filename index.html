
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-lg p-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-blue-600">🛒 Pick Mart</div>
        <div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Cart (0)</button>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="text-center py-10 bg-blue-50">
        <h1 class="text-4xl font-bold text-gray-800">Welcome to Pick Mart</h1>
        <p class="text-gray-500 mt-2">Best Quality Products at Lowest Prices</p>
    </header>

    <!-- Products Grid -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6" id="product-list">
        
        <!-- Sample Product Card -->
        <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-xl transition">
            <img src="https://via.placeholder.com/300" alt="Product" class="w-full h-48 object-cover rounded">
            <h2 class="text-lg font-bold mt-4">Mens Casual Shirt</h2>
            <p class="text-gray-500 text-sm mt-1">Premium quality cotton shirt.</p>
            <div class="flex justify-between items-center mt-4">
                <span class="text-xl font-bold text-green-600">₹499</span>
                <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Buy Now</button>
            </div>
        </div>

        <!-- ഭാവിയിൽ Firebase ഡാറ്റാബേസിൽ നിന്ന് പ്രൊഡക്റ്റുകൾ ഇവിടേക്ക് ലോഡ് ചെയ്യും -->
        
    </main>

</body>
</html>
