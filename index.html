<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <!-- LOGIN OVERLAY -->
    <div id="adminAuthOverlay" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-xl text-center">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Admin Authentication</h2>
            <input type="password" id="adminPassInput" placeholder="Enter Admin Password" class="w-full p-3 border rounded-xl text-center text-sm outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="checkAdminPassword()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Login to Admin</button>
        </div>
    </div>

    <!-- MAIN ADMIN CONTAINER -->
    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Header & Stats Summary -->
        <div class="bg-blue-600 text-white p-4 rounded-2xl shadow space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-extrabold">Pick Mart Admin</h1>
                    <p class="text-[11px] text-blue-100">Store Management Dashboard</p>
                </div>
                <button onclick="location.reload()" class="text-xs bg-blue-700 p-2 rounded-xl border border-blue-500">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
            
            <!-- Order Status Summary Grid -->
            <div class="grid grid-cols-4 gap-1.5 pt-2 border-t border-blue-500/50 text-center">
                <div class="bg-blue-700/60 p-1.5 rounded-xl">
                    <span class="text-[9px] block text-blue-100 uppercase font-bold">Total</span>
                    <span id="statTotal" class="text-sm font-black">0</span>
                </div>
                <div class="bg-orange-600/70 p-1.5 rounded-xl">
                    <span class="text-[9px] block text-blue-100 uppercase font-bold">Out for Del</span>
                    <span id="statOut" class="text-sm font-black">0</span>
                </div>
                <div class="bg-green-600/70 p-1.5 rounded-xl">
                    <span class="text-[9px] block text-blue-100 uppercase font-bold">Delivered</span>
                    <span id="statDelivered" class="text-sm font-black">0</span>
                </div>
                <div class="bg-red-600/70 p-1.5 rounded-xl">
                    <span class="text-[9px] block text-blue-100 uppercase font-bold">Cancelled</span>
                    <span id="statCancelled" class="text-sm font-black">0</span>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b pb-2 overflow-x-auto no-scrollbar">
            <button onclick="switchAdminTab('ordersTab')" id="tab-ordersTab" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">📦 Orders</button>
            <button onclick="switchAdminTab('productsTab')" id="tab-productsTab" class="bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">🏷️ Products</button>
            <button onclick="switchAdminTab('categoriesTab')" id="tab-categoriesTab" class="bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">📂 Categories</button>
            <button onclick="switchAdminTab('reviewsTab')" id="tab-reviewsTab" class="bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">⭐ Reviews</button>
        </div>

        <!-- TAB 1: ORDERS MANAGEMENT -->
        <div id="ordersTab" class="tab-sec space-y-3">
            <h3 class="font-bold text-sm text-gray-800">Orders & Delivery Management</h3>
            <div id="ordersList" class="space-y-3">
                <p class="text-center text-gray-400 py-6 text-xs">Loading orders...</p>
            </div>
        </div>

        <!-- TAB 2: PRODUCTS MANAGEMENT -->
        <div id="productsTab" class="tab-sec hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm text-gray-800 border-b pb-2">Add New Product (Multiple Photos)</h3>
                <form onsubmit="handleAddProduct(event)" class="space-y-3">
                    <input type="text" id="prodName" placeholder="Product Title *" class="w-full p-2.5 border rounded-xl text-xs" required>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="prodPrice" placeholder="Online Price ₹ *" class="p-2.5 border rounded-xl text-xs" required>
                        <input type="number" id="prodCodPrice" placeholder="COD Price ₹ *" class="p-2.5 border rounded-xl text-xs" required>
                    </div>

                    <!-- MULTIPLE IMAGE FILE UPLOAD -->
                    <div class="bg-gray-50 p-2.5 border rounded-xl space-y-1">
                        <label class="block text-xs font-bold text-gray-700">📷 Select Multiple Photos *</label>
                        <input type="file" id="prodImageFiles" accept="image/*" multiple class="w-full text-xs text-gray-700">
                    </div>

                    <input type="text" id="prodOptions" placeholder="Options (e.g. 500g, 1kg)" class="w-full p-2.5 border rounded-xl text-xs">
                    <input type="text" id="prodCategory" placeholder="Category Name" class="w-full p-2.5 border rounded-xl text-xs">
                    
                    <button type="submit" id="saveProdBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">Save Product</button>
                </form>
            </div>

            <div id="productsList" class="grid grid-cols-2 gap-2.5">
                <p class="col-span-2 text-center text-gray-400 py-6 text-xs">Loading products...</p>
            </div>
        </div>

        <!-- TAB 3: CATEGORIES MANAGEMENT -->
        <div id="categoriesTab" class="tab-sec hidden space-y-3">
            <div class="bg-white p-4 rounded-2xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm border-b pb-2">Add Category</h3>
                <form onsubmit="handleAddCategory(event)" class="flex gap-2">
                    <input type="text" id="catNameInput" placeholder="Category Name" class="flex-1 p-2.5 border rounded-xl text-xs" required>
                    <button type="submit" class="bg-blue-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs">Add</button>
                </form>
            </div>
            <div id="categoriesList" class="space-y-2"></div>
        </div>

        <!-- TAB 4: REVIEWS & RATINGS -->
        <div id="reviewsTab" class="tab-sec hidden space-y-3">
            <h3 class="font-bold text-sm text-gray-800">Customer Ratings & Reviews</h3>
            <div id="reviewsList" class="space-y-2">
                <p class="text-center text-gray-400 py-6 text-xs">Loading reviews...</p>
            </div>
        </div>

    </div>

    <!-- IMAGE LIGHTBOX MODAL FOR CLEAR/ZOOM VIEW -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalFullImg" src="" class="max-w-full max-h-[90vh] rounded-xl border-2 border-white">
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYIQOX3FYTx1eN5Z-xD6dj8elfOilbbuU",
            authDomain: "pick-mart.firebaseapp.com",
            projectId: "pick-mart",
            storageBucket: "pick-mart.firebasestorage.app",
            messagingSenderId: "438637337844",
            appId: "1:438637337844:web:80734d96769e06fa6d12a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkAdminPassword = function() {
            const pass = document.getElementById('adminPassInput').value;
            if(pass === "1234" || pass === "admin") {
                document.getElementById('adminAuthOverlay').classList.add('hidden');
                loadOrders();
                loadProducts();
                loadCategories();
                loadReviews();
            } else {
                alert("Incorrect Password!");
            }
        };

        window.switchAdminTab = function(tabId) {
            document.querySelectorAll('.tab-sec').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('button[id^="tab-"]').forEach(b => {
                b.className = "bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap";
            });
            document.getElementById('tab-' + tabId).className = "bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap";
        };

        // Multiple Photo Compression
        function compressFiles(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 600;
                            canvas.height = Math.round((img.height * 600) / img.width);
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                    };
                });
            }));
        }

        // Add Product Logic
        window.handleAddProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveProdBtn');
            btn.disabled = true;
            btn.innerText = "Processing Photos...";

            const files = document.getElementById('prodImageFiles').files;
            if(files.length === 0) {
                alert("കുറഞ്ഞത് ഒരു ഫോട്ടോയെങ്കിലും തിരഞ്ഞെടുക്കുക!");
                btn.disabled = false;
                btn.innerText = "Save Product";
                return;
            }

            const images = await compressFiles(files);

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('prodName').value,
                    price: Number(document.getElementById('prodPrice').value),
                    codPrice: Number(document.getElementById('prodCodPrice').value),
                    images: images,
                    options: document.getElementById('prodOptions').value,
                    category: document.getElementById('prodCategory').value,
                    timestamp: new Date()
                });
                alert("Product Added Successfully!");
                e.target.reset();
                loadProducts();
            } catch(err) { alert("Error: " + err.message); }
            finally { btn.disabled = false; btn.innerText = "Save Product"; }
        };

        // Load Products with Zoomable Image Click & Copy Insta Link
        async function loadProducts() {
            const grid = document.getElementById('productsList');
            const snap = await getDocs(collection(db, "products"));

            if(snap.empty) return grid.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-6 text-xs">No products added.</p>';

            grid.innerHTML = '';
            snap.forEach(docSnap => {
                const p = docSnap.data();
                const id = docSnap.id;
                const imgs = p.images || [p.image];
                grid.innerHTML += `
                    <div class="bg-white p-2.5 rounded-2xl border space-y-1.5 text-xs shadow-sm">
                        <img src="${imgs[0]}" onclick="openImageModal('${imgs[0]}')" class="w-full h-28 object-cover rounded-xl cursor-pointer hover:opacity-90" title="Click to view full image">
                        <h4 class="font-bold line-clamp-1">${p.name}</h4>
                        <p class="text-blue-700 font-bold">₹${p.price} <span class="text-[10px] text-gray-400">(${imgs.length} photos)</span></p>
                        
                        <!-- INSTAGRAM LINK COPY BUTTON -->
                        <button onclick="copyInstaLink('${id}')" class="w-full bg-purple-50 text-purple-700 border border-purple-200 font-bold py-1.5 rounded-xl text-[10px] flex items-center justify-center space-x-1">
                            <i class="fa-brands fa-instagram"></i> <span>Copy Insta Link</span>
                        </button>
                        
                        <button onclick="deleteProduct('${id}')" class="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-1 rounded-xl text-[10px]">Delete</button>
                    </div>
                `;
            });
        }

        window.copyInstaLink = function(productId) {
            const link = `https://pickmart-store.github.io/Pick-Mart/?id=${productId}`;
            navigator.clipboard.writeText(link);
            alert("Instagram Direct Link Copied!\n\n" + link);
        };

        window.deleteProduct = async function(id) {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };

        // Load Orders with Counters, Dropdowns & Payment Screenshot Viewer
        async function loadOrders() {
            const list = document.getElementById('ordersList');
            const snap = await getDocs(collection(db, "orders"));
            
            let total = snap.size;
            let outCount = 0;
            let delCount = 0;
            let canCount = 0;

            if(snap.empty) {
                list.innerHTML = '<p class="text-center py-6 text-gray-400 text-xs">No orders received.</p>';
                document.getElementById('statTotal').innerText = 0;
                document.getElementById('statOut').innerText = 0;
                document.getElementById('statDelivered').innerText = 0;
                document.getElementById('statCancelled').innerText = 0;
                return;
            }

            list.innerHTML = '';
            snap.forEach(docSnap => {
                const o = docSnap.data();
                const id = docSnap.id;
                const status = o.status || 'Order Placed';

                if(status.toLowerCase().includes('out')) outCount++;
                if(status.toLowerCase().includes('deliver')) delCount++;
                if(status.toLowerCase().includes('cancel')) canCount++;

                list.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl border space-y-2 text-xs shadow-sm">
                        <div class="flex justify-between border-b pb-2 items-start">
                            <div>
                                <h4 class="font-bold text-blue-900 text-sm">${o.productName}</h4>
                                <p class="text-xs text-green-700 font-extrabold">₹${o.price} (${o.paymentMethod})</p>
                                <p class="text-[10px] text-gray-400">${o.orderDateFormatted || ''}</p>
                            </div>
                            <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full">${status}</span>
                        </div>
                        <div class="space-y-1 text-gray-600">
                            <p><b>Customer:</b> ${o.name} (${o.phone})</p>
                            <p><b>Address:</b> ${o.address}</p>
                            ${o.gpsMapLink ? `<a href="${o.gpsMapLink}" target="_blank" class="text-blue-600 font-bold underline text-[11px]">📍 View Location on Maps</a>` : ''}
                        </div>
                        
                        <!-- PAYMENT SCREENSHOT THUMBNAIL -->
                        ${o.paymentScreenshot ? `
                            <div class="pt-1 flex items-center space-x-2">
                                <span class="font-bold text-gray-500 text-[10px]">Payment Proof:</span>
                                <img src="${o.paymentScreenshot}" onclick="openImageModal('${o.paymentScreenshot}')" class="w-12 h-12 object-cover rounded-lg border cursor-pointer hover:opacity-80" title="Click to view full screenshot">
                            </div>
                        ` : ''}
                        
                        <!-- STATUS DROPDOWN & UPDATE -->
                        <div class="bg-gray-50 p-2.5 rounded-xl border space-y-2 pt-2">
                            <label class="block font-bold text-gray-700 text-[11px]">Update Order Status:</label>
                            <div class="flex gap-2">
                                <select id="st-${id}" class="flex-1 p-2 border rounded-xl text-xs bg-white font-bold">
                                    <option value="Order Placed" ${status === 'Order Placed' ? 'selected' : ''}>Order Placed</option>
                                    <option value="Out for Delivery" ${status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                                    <option value="Delivered" ${status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                                <button onclick="updateOrderStatus('${id}')" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">Update</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statOut').innerText = outCount;
            document.getElementById('statDelivered').innerText = delCount;
            document.getElementById('statCancelled').innerText = canCount;
        }

        window.updateOrderStatus = async function(id) {
            const st = document.getElementById('st-' + id).value;
            await updateDoc(doc(db, "orders", id), { status: st });
            alert("Order Status Updated Successfully!");
            loadOrders();
        };

        window.openImageModal = function(imgSrc) {
            document.getElementById('modalFullImg').src = imgSrc;
            document.getElementById('imageModal').classList.remove('hidden');
        };

        window.closeImageModal = function() {
            document.getElementById('imageModal').classList.add('hidden');
        };

        // Categories Add & Delete Management
        window.handleAddCategory = async function(e) {
            e.preventDefault();
            const name = document.getElementById('catNameInput').value;
            await addDoc(collection(db, "categories"), { name });
            document.getElementById('catNameInput').value = '';
            loadCategories();
        };

        async function loadCategories() {
            const list = document.getElementById('categoriesList');
            const snap = await getDocs(collection(db, "categories"));
            list.innerHTML = '';
            if(snap.empty) {
                list.innerHTML = '<p class="text-center text-gray-400 py-4 text-xs">No categories found.</p>';
                return;
            }
            snap.forEach(docSnap => {
                const c = docSnap.data();
                const id = docSnap.id;
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border text-xs font-bold flex justify-between items-center shadow-sm">
                        <span>${c.name}</span>
                        <button onclick="deleteCategory('${id}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-lg border border-red-200">Delete</button>
                    </div>
                `;
            });
        }

        window.deleteCategory = async function(id) {
            if(confirm("Delete this category?")) {
                await deleteDoc(doc(db, "categories", id));
                loadCategories();
            }
        };

        // Reviews Management
        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            const snap = await getDocs(collection(db, "reviews"));
            if(snap.empty) return list.innerHTML = '<p class="text-center py-6 text-gray-400 text-xs">No reviews submitted.</p>';

            list.innerHTML = '';
            snap.forEach(docSnap => {
                const r = docSnap.data();
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border text-xs space-y-1 shadow-sm">
                        <div class="flex justify-between font-bold">
                            <span>${r.userName || 'Customer'}</span>
                            <span class="text-amber-500">${'⭐'.repeat(r.rating || 5)}</span>
                        </div>
                        <p class="text-gray-600">${r.comment}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
