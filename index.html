
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Shop More, Worry Less</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        .navbar { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo { height: 40px; }
        .logo-container h1 { color: #004aad; font-size: 24px; margin: 0; }
        .cart-btn { background: #ff6600; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .header { background: #e0f0ff; text-align: center; padding: 40px 20px; }
        .header h2 { color: #333; margin: 0 0 10px 0; font-size: 28px; }
        .header p { color: #666; margin: 0; }
        .products { padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 5px; }
        .card h4 { margin: 10px 0; color: #333; }
        .price { color: #28a745; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .buy-btn { background: #004aad; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container">
        <!-- ലോഗോ ഇവിടെ വരും -->
        <img src="1000439092.png" alt="Pick Mart Logo" class="logo">
        <h1>Pick Mart</h1>
    </div>
    <button class="cart-btn" onclick="alert('Cart is empty!')">Cart (0)</button>
</nav>

<header class="header">
    <h2>Shop More, Worry Less!</h2>
    <p>മികച്ച ക്വാളിറ്റി പ്രൊഡക്റ്റുകൾ, ഏറ്റവും കുറഞ്ഞ വിലയിൽ.</p>
</header>

<div class="products">
    <h3>Trending Products</h3>
    <div class="products-grid">
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Product">
            <h4>Casual T-Shirt</h4>
            <p class="price">₹499</p>
            <button class="buy-btn" onclick="addToCart()">Buy Now</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/150" alt="Product">
            <h4>Smart Watch</h4>
            <p class="price">₹1299</p>
            <button class="buy-btn" onclick="addToCart()">Buy Now</button>
        </div>
    </div>
</div>

<script>
    let cartCount = 0;
    function addToCart() {
        cartCount++;
        document.querySelector('.cart-btn').innerText = `Cart (${cartCount})`;
        alert('പ്രൊഡക്റ്റ് കാർട്ടിലേക്ക് ചേർത്തു!');
    }
</script>

</body>
</html>
