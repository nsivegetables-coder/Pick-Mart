
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <img src="1000439092.png" alt="Pick Mart Logo" class="h-10">
            <h1 class="text-2xl font-bold text-blue-600">Pick Mart</h1>
        </div>
        <span class="bg-orange-500 text-white text-xs px-3 py-1 rounded-full font-bold">Fast Delivery</span>
    </nav>

    <!-- Banner -->
    <div class="bg-blue-600 text-white text-center py-8 px-4">
        <h2 class="text-3xl font-bold">Shop More, Worry Less!</h2>
        <p class="text-sm mt-1 opacity-90">മികച്ച ക്വാളിറ്റി പ്രൊഡക്റ്റുകൾ, ഏറ്റവും കുറഞ്ഞ നിരക്കിൽ.</p>
    </div>

    <!-- Products Container -->
    <div class="max-w-6xl mx-auto p-4">
        <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Trending Products</h3>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="text-gray-500 text-center col-span-full py-10">പ്രൊഡക്റ്റുകൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- Order Modal (Popup) -->
    <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-2 right-4 text-2xl font-bold text-gray-500">&times;</button>
            <h3 class="text-xl font-bold text-gray-800 mb-2">ഓർഡർ ചെയ്യുക (Buy Now)</h3>
            <p id="modalProductName" class="text-blue-600 font-semibold mb-4"></p>

            <form id="orderForm" class="space-y-3">
                <input type="hidden" id="orderPName">
                <input type="hidden" id="orderPPrice">

                <div>
                    <label class="block text-xs font-bold text-gray-600">പേര് (Full Name)</label>
                    <input type="text" id="custName" placeholder="നിങ്ങളുടെ പേര്" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600">ഫോൺ നമ്പർ (Phone Number)</label>
                    <input type="tel" id="custPhone" placeholder="10 അക്ക മൊബൈൽ നമ്പർ" class="w-full p-2 border rounded" required pattern="[0-9]{10}">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600">ഡെലിവറി വിലാസം (Full Address)</label>
                    <textarea id="custAddress" placeholder="വീട്ടുപേര്, പിൻകോഡ്, ലൊക്കേഷൻ" class="w-full p-2 border rounded h-20" required></textarea>
                </div>

                <div class="bg-gray-100 p-3 rounded flex justify-between items-center">
                    <span class="text-sm font-semibold">പണമടയ്ക്കേണ്ട തുക:</span>
                    <span id="modalProductPrice" class="text-lg font-bold text-green-600"></span>
                </div>

                <button type="submit" id="submitOrderBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700">
                    Order Confirm ചെയ്യുക (Cash on Delivery)
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // നിങ്ങളുടേതായ Firebase Config[span_1](start_span)[span_1](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyA1QQX3FYTs1eN5Z-x0mdjBw1F0llBmuo",
            authDomain: "pick-mart.firebaseapp.com",
            projectId: "pick-mart",
            storageBucket: "pick-mart.firebasestorage.app",
            messagingSenderId: "438637337844",
            appId: "1:438637337844:web:88734d96769e66faed12a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // പ്രൊഡക്റ്റുകൾ ലോഡ് ചെയ്യുക
        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    grid.innerHTML = '<p class="text-gray-500 text-center col-span-full">ഇതുവരെ പ്രൊഡക്റ്റുകൾ ഒന്നും ആഡ് ചെയ്തിട്ടില്ല.</p>';
                    return;
                }
                grid.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    grid.innerHTML += `
                        <div class="bg-white rounded-lg shadow hover:shadow-lg transition p-4 flex flex-col justify-between">
                            <div>
                                <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover rounded mb-3">
                                <h4 class="font-bold text-lg text-gray-800">${p.name}</h4>
                                <p class="text-green-600 font-bold text-xl my-2">₹${p.price}</p>
                            </div>
                            <button onclick="openOrderModal('${p.name}', ${p.price})" class="bg-blue-600 text-white w-full py-2 rounded font-bold hover:bg-blue-700 mt-2">
                                Buy Now
                            </button>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-red-500 text-center col-span-full">ഡാറ്റാബേസ് ലോഡിംഗിൽ തകരാർ!</p>';
            }
        }

        // ഓർഡർ ഫോം സബ്‌മിറ്റ്
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                await addDoc(collection(db, "orders"), {
                    productName: document.getElementById('orderPName').value,
                    price: document.getElementById('orderPPrice').value,
                    name: document.getElementById('custName').value,
                    phone: document.getElementById('custPhone').value,
                    address: document.getElementById('custAddress').value,
                    timestamp: serverTimestamp()
                });
                alert("അഭിനന്ദനങ്ങൾ! നിങ്ങളുടെ ഓർഡർ വിജയകരമായി സബ്‌മിറ്റ് ചെയ്തു.");
                closeModal();
                document.getElementById('orderForm').reset();
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Order Confirm ചെയ്യുക (Cash on Delivery)";
            }
        });

        window.openOrderModal = function(name, price) {
            document.getElementById('orderPName').value = name;
            document.getElementById('orderPPrice').value = price;
            document.getElementById('modalProductName').innerText = name;
            document.getElementById('modalProductPrice').innerText = "₹" + price;
            document.getElementById('orderModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('orderModal').classList.add('hidden');
        };

        loadProducts();
    </script>
</body>
</html>
