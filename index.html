<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen pb-20 font-sans">

    <!-- TOP HEADER NAVBAR -->
    <header class="bg-blue-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" onclick="location.reload()" class="flex items-center space-x-2">
                <span class="text-2xl">🛒</span>
                <span class="font-extrabold text-xl tracking-wide">Pick Mart</span>
            </a>

            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- LANGUAGE SELECTOR DROPDOWN -->
                <div class="relative bg-blue-800 rounded-lg px-2 py-1 flex items-center border border-blue-700">
                    <span class="text-xs mr-1">🌐</span>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-transparent text-xs font-bold text-white focus:outline-none cursor-pointer">
                        <option value="en" class="text-black">English</option>
                        <option value="ml" class="text-black">മലയാളം</option>
                        <option value="ta" class="text-black">தமிழ்</option>
                        <option value="hi" class="text-black">हिंदी</option>
                    </select>
                </div>

                <!-- TRACK ORDER BUTTON -->
                <button onclick="openTrackModal()" class="text-xs font-bold bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg flex items-center space-x-1 border border-blue-700">
                    <span>📦</span>
                    <span data-i18n="btnTrack">Track</span>
                </button>

                <!-- CART BUTTON -->
                <button onclick="openCartModal()" class="relative p-1.5 text-xl">
                    🛒
                    <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto px-3 py-4 space-y-4">

        <!-- SEARCH BAR -->
        <div class="relative">
            <input type="text" id="searchInput" onkeyup="filterProducts()" data-i18n-ph="searchPlaceholder" placeholder="Search products..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
        </div>

        <!-- CATEGORY PILLS -->
        <div id="categoryContainer" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterByCategory('all')" class="cat-btn bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-sm" data-i18n="catAll">All</button>
        </div>

        <!-- PRODUCT GRID -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <p class="col-span-full text-center text-gray-400 py-10 text-sm" data-i18n="loadingProducts">Loading products...</p>
        </div>

        <!-- FAQ SECTION -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border space-y-3 mt-6">
            <h3 class="font-bold text-gray-800 text-sm flex items-center space-x-2">
                <span>❓</span>
                <span data-i18n="faqTitle">Frequently Asked Questions</span>
            </h3>
            <div id="faqList" class="space-y-2 text-xs"></div>
        </section>

    </main>

    <!-- CHECKOUT MODAL -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl md:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-base text-gray-800" data-i18n="checkoutTitle">Order Checkout</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-400 font-bold text-lg">✕</button>
            </div>

            <div id="checkoutProductSummary" class="bg-blue-50 p-3 rounded-xl border border-blue-100 flex items-center space-x-3"></div>

            <form id="orderForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="lblFullName">Full Name *</label>
                    <input type="text" id="custName" required class="w-full p-2.5 border rounded-xl text-sm" data-i18n-ph="phName" placeholder="Enter your name">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="lblPhone">Phone Number *</label>
                    <input type="tel" id="custPhone" required pattern="[0-9]{10}" class="w-full p-2.5 border rounded-xl text-sm" data-i18n-ph="phPhone" placeholder="10-digit mobile number">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="lblAddress">Delivery Address *</label>
                    <textarea id="custAddress" required rows="2" class="w-full p-2.5 border rounded-xl text-sm" data-i18n-ph="phAddress" placeholder="House name/number, area, pincode"></textarea>
                </div>

                <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border">
                    <span class="text-xs font-bold text-gray-600" data-i18n="lblGps">GPS Location Link</span>
                    <button type="button" onclick="getGPSLocation()" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1">
                        <span>📍</span>
                        <span data-i18n="btnGps">Add Location</span>
                    </button>
                </div>
                <input type="hidden" id="gpsLinkInput">

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="lblPaymentMethod">Payment Option *</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer font-bold text-xs bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                            <input type="radio" name="payMethod" value="Online" checked onchange="togglePaymentBox('Online')" class="hidden">
                            <span>💳 <span data-i18n="optPayOnline">Pay Online</span></span>
                            <span id="onlinePriceTag" class="text-[10px] text-green-600 font-extrabold mt-1">₹0</span>
                        </label>
                        <label class="border p-3 rounded-xl flex flex-col items-center justify-center cursor-pointer font-bold text-xs bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                            <input type="radio" name="payMethod" value="COD" onchange="togglePaymentBox('COD')" class="hidden">
                            <span>💵 <span data-i18n="optCod">Cash on Delivery</span></span>
                            <span id="codPriceTag" class="text-[10px] text-gray-500 font-extrabold mt-1">₹0</span>
                        </label>
                    </div>
                </div>

                <!-- UPI QR BOX -->
                <div id="upiBox" class="bg-blue-50 p-3 rounded-xl border border-blue-200 text-center space-y-2">
                    <p class="text-xs font-bold text-blue-900" data-i18n="upiMsg">Scan QR & Pay with Google Pay / PhonePe / Paytm</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=pickmart@upi" class="w-32 h-32 mx-auto rounded-lg border bg-white p-1">
                    <p class="text-[11px] text-gray-600 font-bold">UPI ID: <span class="text-blue-900">pickmart@upi</span></p>
                    
                    <div class="text-left bg-white p-2 rounded-lg border">
                        <label class="block text-[11px] font-bold text-gray-700 mb-1" data-i18n="lblScreenshot">Upload Payment Screenshot *</label>
                        <input type="file" id="payScreenshot" accept="image/*" class="w-full text-xs">
                    </div>
                </div>

                <button type="submit" id="submitOrderBtn" class="w-full bg-green-600 text-white font-extrabold py-3 rounded-xl text-sm shadow-md hover:bg-green-700" data-i18n="btnConfirmOrder">
                    Confirm & Place Order
                </button>
            </form>
        </div>
    </div>

    <!-- TRACK ORDER MODAL -->
    <div id="trackModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-base text-gray-800" data-i18n="trackTitle">Track Order Status</h3>
                <button onclick="closeTrackModal()" class="text-gray-400 font-bold text-lg">✕</button>
            </div>
            
            <div class="flex gap-2">
                <input type="tel" id="trackPhoneInput" data-i18n-ph="phTrackPhone" placeholder="Enter Phone Number" class="flex-1 p-2.5 border rounded-xl text-sm">
                <button onclick="fetchOrderTracking()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs" data-i18n="btnSearch">Search</button>
            </div>

            <div id="trackingResult" class="space-y-3 pt-2"></div>
        </div>
    </div>

                optPayOnline: "ऑनलाइन भुगतान",
                optCod: "कैश ऑन डिलीवरी",
                upiMsg: "QR कोड स्कैन करके भुगतान करें",
                lblScreenshot: "भुगतान का स्क्रीनशॉट अपलोड करें *",
                btnConfirmOrder: "ऑर्डर की पुष्टि करें",
                trackTitle: "ऑर्डर ट्रैक करें",
                phTrackPhone: "फोन नंबर दर्ज करें",
                btnSearch: "खोजें",
                buyNow: "अभी खरीदें",
                optSelect: "विकल्प:",
                reviews: "समीक्षाएं",

        let currentLang = localStorage.getItem('pickmart_lang') || 'en';
        let allProducts = [];
        let activeProductForCheckout = null;

        window.changeLanguage = function(langKey) {
            currentLang = langKey;
            localStorage.setItem('pickmart_lang', langKey);
            document.getElementById('langSelect').value = langKey;
            applyTranslations();
            renderProducts(allProducts);
        };

        function applyTranslations() {
            const dict = i18nData[currentLang] || i18nData['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (dict[key]) el.placeholder = dict[key];
            });
        }

        // INITIAL LOAD
        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('langSelect').value = currentLang;
            applyTranslations();

            await loadCategories();
            await loadProducts();
            await loadFaqs();

            // Direct URL Check (from Insta link)
            const urlParams = new URLSearchParams(window.location.search);
            const pId = urlParams.get('id');
            if (pId) {
                openProductDirectly(pId);
            }
        });

        async function loadCategories() {
            const container = document.getElementById('categoryContainer');
            const snap = await getDocs(collection(db, "categories"));
            snap.forEach(docSnap => {
                const cName = docSnap.data().name;
                container.innerHTML += `
                    <button onclick="filterByCategory('${cName}')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap">${cName}</button>
                `;
            });
        }

        async function loadProducts() {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(docSnap => {
                allProducts.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const dict = i18nData[currentLang] || i18nData['en'];

            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10 text-sm">No products found.</p>`;
                return;
            }

            products.forEach(p => {
                const img = p.images && p.images.length > 0 ? p.images[0] : (p.image || 'https://via.placeholder.com/150');
                const optionsArr = p.options ? p.options.split(',') : [];

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col justify-between p-2.5">
                        <div class="space-y-2">
                            <img src="${img}" class="w-full h-36 object-cover rounded-xl">
                            <h4 class="font-extrabold text-xs text-gray-800 line-clamp-1">${p.name}</h4>
                            
                            <div class="flex items-center justify-between text-xs">
                                <div>
                                    <span class="text-green-700 font-black text-sm">₹${p.price}</span>
                                    <span class="text-[10px] text-gray-400 line-through">₹${p.codPrice}</span>
                                </div>
                                <span class="bg-green-100 text-green-800 text-[9px] font-extrabold px-1.5 py-0.5 rounded">Pay Online</span>
                            </div>

                            ${optionsArr.length > 0 ? `
                                <div class="text-[10px]">
                                    <label class="font-bold text-gray-500">${dict.optSelect}</label>
                                    <select id="opt-${p.id}" class="w-full border rounded p-1 text-[11px]">
                                        ${optionsArr.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('')}
                                    </select>
                                </div>
                            ` : ''}
                        </div>

                        <button onclick="startCheckout('${p.id}')" class="mt-3 w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-xs hover:bg-blue-700 shadow-sm flex items-center justify-center space-x-1">
                            <span>🛍️</span>
                            <span>${dict.buyNow}</span>
                        </button>
                    </div>
                `;
            });
        }

        window.filterByCategory = function(cat) {
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        };

        window.filterProducts = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        };

        async function openProductDirectly(pId) {
            const pDoc = await getDoc(doc(db, "products", pId));
            if (pDoc.exists()) {
                startCheckout(pId);
            }
        }

        window.startCheckout = function(pId) {
            const product = allProducts.find(p => p.id === pId);
            if (!product) return;

            activeProductForCheckout = product;
            const selectedOpt = document.getElementById(`opt-${pId}`) ? document.getElementById(`opt-${pId}`).value : '';

            const summary = document.getElementById('checkoutProductSummary');
            const img = product.images && product.images.length > 0 ? product.images[0] : (product.image || '');

            summary.innerHTML = `
                <img src="${img}" class="w-12 h-12 object-cover rounded-lg">
                <div class="text-xs">
                    <h5 class="font-extrabold text-blue-900">${product.name}</h5>
                    ${selectedOpt ? `<p class="text-gray-500 font-bold">Selected: ${selectedOpt}</p>` : ''}
                </div>
            `;

            document.getElementById('onlinePriceTag').innerText = `₹${product.price}`;
            document.getElementById('codPriceTag').innerText = `₹${product.codPrice}`;

            document.getElementById('checkoutModal').classList.remove('hidden');
        };

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').classList.add('hidden');
        };

        window.togglePaymentBox = function(method) {
            const upiBox = document.getElementById('upiBox');
            if (method === 'Online') {
                upiBox.classList.remove('hidden');
            } else {
                upiBox.classList.add('hidden');
            }
        };

        window.getGPSLocation = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    document.getElementById('gpsLinkInput').value = link;
                    alert("GPS Location added successfully!");
                }, () => alert("Could not fetch location. Please allow GPS permission."));
            } else { alert("Geolocation not supported."); }
        };

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            const method = document.querySelector('input[name="payMethod"]:checked').value;
            const price = method === 'Online' ? activeProductForCheckout.price : activeProductForCheckout.codPrice;
            const profit = price - (activeProductForCheckout.costPrice || 0);

            let screenshotBase64 = "";
            if (method === 'Online') {
                const fileInput = document.getElementById('payScreenshot');
                if (fileInput.files.length > 0) {
                    screenshotBase64 = await compressImg(fileInput.files[0]);
                }
            }

            const now = new Date();
            const monthKey = `${now.getMonth()+1}-${now.getFullYear()}`;

            try {
                await addDoc(collection(db, "orders"), {
                    productId: activeProductForCheckout.id,
                    productName: activeProductForCheckout.name,
                    name: document.getElementById('custName').value,
                    phone: document.getElementById('custPhone').value,
                    address: document.getElementById('custAddress').value,
                    gpsMapLink: document.getElementById('gpsLinkInput').value,
                    paymentMethod: method,
                    price: price,
                    profit: profit,
                    paymentScreenshot: screenshotBase64,
                    status: "Order Placed",
                    monthKey: monthKey,
                    timestamp: now,
                    orderDateFormatted: now.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true })
                });

                alert("🎉 Order placed successfully!");
                closeCheckoutModal();
                document.getElementById('orderForm').reset();
            } catch(err) { alert("Order Failed: " + err.message); }
            finally { btn.disabled = false; btn.innerText = "Confirm & Place Order"; }
        });

        function compressImg(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 400;
                        canvas.height = Math.round((img.height * 400) / img.width);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        // TRACK ORDER MODAL LOGIC
        window.openTrackModal = function() {
            document.getElementById('trackModal').classList.remove('hidden');
        };

        window.closeTrackModal = function() {
            document.getElementById('trackModal').classList.add('hidden');
        };

        window.fetchOrderTracking = async function() {
            const phone = document.getElementById('trackPhoneInput').value.trim();
            const resultDiv = document.getElementById('trackingResult');
            resultDiv.innerHTML = '<p class="text-xs text-gray-400 text-center">Searching...</p>';

            if (!phone) return alert("Please enter phone number");

            const q = query(collection(db, "orders"), where("phone", "==", phone));
            const snap = await getDocs(q);

            resultDiv.innerHTML = '';
            if (snap.empty) {
                resultDiv.innerHTML = `<p class="text-xs text-red-500 text-center">No orders found for this number.</p>`;
                return;
            }

            snap.forEach(docSnap => {
                const o = docSnap.data();
                resultDiv.innerHTML += `
                    <div class="border p-3 rounded-xl bg-blue-50/50 space-y-1 text-xs">
                        <div class="flex justify-between font-bold text-blue-900">
                            <span>${o.productName}</span>
                            <span class="text-green-700">₹${o.price}</span>
                        </div>
                        <p class="text-[11px] text-gray-500">Status: <b class="text-blue-700">${o.status}</b></p>
                        ${o.currentLocation ? `<p class="text-[11px] text-gray-600">Location: 📍 ${o.currentLocation}</p>` : ''}
                    </div>
                `;
            });
        };

        async function loadFaqs() {
            const list = document.getElementById('faqList');
            const snap = await getDocs(collection(db, "faqs"));
            list.innerHTML = '';
            snap.forEach(docSnap => {
                const f = docSnap.data();
                list.innerHTML += `
                    <details class="bg-gray-50 p-2.5 rounded-xl border">
                        <summary class="font-bold text-gray-800 cursor-pointer">❓ ${f.question}</summary>
                        <p class="text-gray-600 mt-1 pl-4">${f.answer}</p>
                    </details>
                `;
            });
        }
    </script>
</body>
</html>
