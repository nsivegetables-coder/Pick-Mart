<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-10 text-gray-800">

    <div class="max-w-md mx-auto p-4 space-y-4">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 rounded-xl shadow flex justify-between items-center">
            <h1 class="text-lg font-bold">Pick Mart Admin</h1>
            <button onclick="location.reload()" class="text-xs bg-blue-700 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b pb-2 overflow-x-auto">
            <button onclick="switchTab('ordersTab')" id="tab-ordersTab" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold">Orders</button>
            <button onclick="switchTab('productsTab')" id="tab-productsTab" class="bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold">Add Product</button>
            <button onclick="switchTab('categoriesTab')" id="tab-categoriesTab" class="bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold">Categories</button>
        </div>

        <!-- TAB 1: ORDERS -->
        <div id="ordersTab" class="tab-sec space-y-3">
            <h3 class="font-bold text-sm">Customer Orders</h3>
            <div id="ordersList" class="space-y-3">
                <p class="text-center text-gray-400 py-6 text-xs">Loading orders...</p>
            </div>
        </div>

        <!-- TAB 2: PRODUCTS -->
        <div id="productsTab" class="tab-sec hidden space-y-4">
            <div class="bg-white p-4 rounded-xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm text-gray-800 border-b pb-2">Add Product</h3>
                <form onsubmit="handleAddProduct(event)" class="space-y-3">
                    <input type="text" id="prodName" placeholder="Product Name *" class="w-full p-2.5 border rounded-lg text-xs" required>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="prodPrice" placeholder="Online Price ₹ *" class="p-2.5 border rounded-lg text-xs" required>
                        <input type="number" id="prodCodPrice" placeholder="COD Price ₹ *" class="p-2.5 border rounded-lg text-xs" required>
                    </div>

                    <!-- Multiple File Upload -->
                    <div class="bg-gray-50 p-2.5 border rounded-lg space-y-1">
                        <label class="block text-xs font-bold text-gray-600">Select Multiple Photos *</label>
                        <input type="file" id="prodImageFiles" accept="image/*" multiple class="w-full text-xs text-gray-600">
                    </div>

                    <input type="text" id="prodOptions" placeholder="Options (e.g. 500g, 1kg)" class="w-full p-2.5 border rounded-lg text-xs">
                    <input type="text" id="prodCategory" placeholder="Category" class="w-full p-2.5 border rounded-lg text-xs">
                    
                    <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-xs shadow">Save Product</button>
                </form>
            </div>

            <div id="productsList" class="grid grid-cols-2 gap-2.5"></div>
        </div>

        <!-- TAB 3: CATEGORIES -->
        <div id="categoriesTab" class="tab-sec hidden space-y-3">
            <div class="bg-white p-4 rounded-xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm border-b pb-2">Add Category</h3>
                <form onsubmit="handleAddCategory(event)" class="flex gap-2">
                    <input type="text" id="catName" placeholder="Category Name" class="flex-1 p-2 border rounded-lg text-xs" required>
                    <button type="submit" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-lg text-xs">Add</button>
                </form>
            </div>
            <div id="categoriesList" class="space-y-2"></div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYIQOX3FYTx1eN5Z-xD6dj8elfOilbbuU",
            authDomain: "pick-mart.firebaseapp.com",
            projectId: "pick-mart",
            storageBucket: "pick-mart.firebasestorage.app",
            messagingSenderId: "438637337844",
            appId: "1:438637337844:web:80734d96769e06fa6d12a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-sec').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('button[id^="tab-"]').forEach(b => {
                b.className = "bg-white text-gray-700 border px-3.5 py-1.5 rounded-full text-xs font-bold";
            });
            document.getElementById('tab-' + tabId).className = "bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold";
            
            if(tabId === 'ordersTab') loadOrders();
            if(tabId === 'productsTab') loadProducts();
            if(tabId === 'categoriesTab') loadCategories();
        };

        // Compress multiple image files
        function compressFiles(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 600;
                            canvas.height = Math.round((img.height * 600) / img.width);
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                    };
                });
            }));
        }

        window.handleAddProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "Saving...";

            const files = document.getElementById('prodImageFiles').files;
            if(files.length === 0) {
                alert("ഫോട്ടോകൾ സെലക്ട് ചെയ്യുക!");
                btn.disabled = false;
                btn.innerText = "Save Product";
                return;
            }

            const images = await compressFiles(files);

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('prodName').value,
                    price: Number(document.getElementById('prodPrice').value),
                    codPrice: Number(document.getElementById('prodCodPrice').value),
                    images: images,
                    options: document.getElementById('prodOptions').value,
                    category: document.getElementById('prodCategory').value,
                    timestamp: new Date()
                });
                alert("Product Added!");
                e.target.reset();
                loadProducts();
            } catch(err) { alert("Error: " + err.message); }
            finally { btn.disabled = false; btn.innerText = "Save Product"; }
        };

        async function loadProducts() {
            const grid = document.getElementById('productsList');
            const snap = await getDocs(collection(db, "products"));
            grid.innerHTML = '';
            snap.forEach(docSnap => {
                const p = docSnap.data();
                const id = docSnap.id;
                const imgs = p.images || [p.image];
                grid.innerHTML += `
                    <div class="bg-white p-2 rounded-xl border space-y-1 text-xs">
                        <img src="${imgs[0]}" class="w-full h-28 object-cover rounded-lg">
                        <h4 class="font-bold line-clamp-1">${p.name}</h4>
                        <p class="text-blue-700 font-bold">₹${p.price} (${imgs.length} photos)</p>
                        
                        <!-- INSTAGRAM LINK COPY BUTTON -->
                        <button onclick="copyInstaLink('${id}')" class="w-full bg-purple-100 text-purple-800 font-bold py-1 rounded-lg text-[10px]">
                            🔗 Copy Insta Link
                        </button>
                        
                        <button onclick="deleteProduct('${id}')" class="w-full bg-red-50 text-red-600 font-bold py-1 rounded-lg text-[10px]">Delete</button>
                    </div>
                `;
            });
        }

        window.copyInstaLink = function(productId) {
            const link = `https://pickmart-store.github.io/Pick-Mart/?id=${productId}`;
            navigator.clipboard.writeText(link);
            alert("Instagram Direct Link Copied!\n\n" + link);
        };

        window.deleteProduct = async function(id) {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };

        async function loadOrders() {
            const list = document.getElementById('ordersList');
            const snap = await getDocs(collection(db, "orders"));
            if(snap.empty) return list.innerHTML = '<p class="text-center py-6 text-gray-400 text-xs">No orders.</p>';
            list.innerHTML = '';
            snap.forEach(docSnap => {
                const o = docSnap.data();
                const id = docSnap.id;
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border space-y-2 text-xs">
                        <div class="flex justify-between border-b pb-1">
                            <h4 class="font-bold text-blue-900">${o.productName}</h4>
                            <span class="font-bold text-green-700">₹${o.price}</span>
                        </div>
                        <p><b>Customer:</b> ${o.name} (${o.phone})</p>
                        <p><b>Address:</b> ${o.address}</p>
                        ${o.gpsMapLink ? `<a href="${o.gpsMapLink}" target="_blank" class="text-blue-600 font-bold underline">📍 View GPS Location</a>` : ''}
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="st-${id}" value="${o.status || ''}" placeholder="Status" class="flex-1 p-1 border rounded text-xs">
                            <button onclick="updateOrderStatus('${id}')" class="bg-blue-600 text-white font-bold px-3 rounded text-xs">Save</button>
                        </div>
                    </div>
                `;
            });
        }

        window.updateOrderStatus = async function(id) {
            const st = document.getElementById('st-' + id).value;
            await updateDoc(doc(db, "orders", id), { status: st });
            alert("Status Updated!");
            loadOrders();
        };

        window.handleAddCategory = async function(e) {
            e.preventDefault();
            const name = document.getElementById('catName').value;
            await addDoc(collection(db, "categories"), { name });
            document.getElementById('catName').value = '';
            loadCategories();
        };

        async function loadCategories() {
            const list = document.getElementById('categoriesList');
            const snap = await getDocs(collection(db, "categories"));
            list.innerHTML = '';
            snap.forEach(docSnap => {
                list.innerHTML += `<div class="bg-white p-2 rounded-lg border text-xs font-bold">${docSnap.data().name}</div>`;
            });
        }

        // Initial Load
        loadOrders();
    </script>
</body>
</html>
