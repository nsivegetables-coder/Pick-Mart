<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- LOGIN OVERLAY -->
    <div id="adminAuthOverlay" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-xl text-center">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Admin Authentication</h2>
            <input type="password" id="adminPassInput" placeholder="Enter Admin Password" class="w-full p-3 border rounded-xl text-center text-sm outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="checkAdminPassword()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Login to Admin</button>
        </div>
    </div>

    <!-- MAIN ADMIN CONTAINER -->
    <div class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Pick Mart Admin Dashboard</h1>
                <p class="text-xs text-blue-100">Manage Orders, Products & Store Settings</p>
            </div>
            <button onclick="location.reload()" class="bg-blue-700 p-2.5 rounded-xl text-sm hover:bg-blue-800">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="flex space-x-2 border-b pb-2 overflow-x-auto">
            <button onclick="switchAdminTab('ordersTab')" id="btn-ordersTab" class="tab-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📦 Orders Management</button>
            <button onclick="switchAdminTab('productsTab')" id="btn-productsTab" class="tab-btn bg-white border text-gray-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">🏷️ Products</button>
            <button onclick="switchAdminTab('categoriesTab')" id="btn-categoriesTab" class="tab-btn bg-white border text-gray-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📂 Categories</button>
        </div>

        <!-- TAB 1: ORDERS MANAGEMENT -->
        <div id="ordersTab" class="admin-tab space-y-4">
            <h2 class="font-bold text-base text-gray-800">Customer Orders</h2>
            <div id="ordersList" class="space-y-3">
                <p class="text-gray-400 text-sm text-center py-6">Loading orders...</p>
            </div>
        </div>

        <!-- TAB 2: PRODUCTS MANAGEMENT -->
        <div id="productsTab" class="admin-tab hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm text-gray-800 border-b pb-2">Add New Product</h3>
                <form onsubmit="handleAddProduct(event)" class="space-y-3">
                    <input type="text" id="prodName" placeholder="Product Title *" class="w-full p-2.5 border rounded-xl text-xs" required>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="prodPrice" placeholder="Online Price ₹ *" class="p-2.5 border rounded-xl text-xs" required>
                        <input type="number" id="prodCodPrice" placeholder="COD Price ₹ *" class="p-2.5 border rounded-xl text-xs" required>
                        <input type="number" id="prodCostPrice" placeholder="Cost Price ₹" class="p-2.5 border rounded-xl text-xs">
                    </div>
                    
                    <!-- MULTIPLE IMAGE UPLOAD FIELD -->
                    <div class="bg-gray-50 p-2.5 border rounded-xl space-y-1">
                        <label class="block text-xs font-bold text-gray-700">📷 Select Product Photos (Multiple Photos Allowed):</label>
                        <input type="file" id="prodImageFiles" accept="image/*" multiple class="w-full text-xs text-gray-700">
                    </div>
                    <input type="text" id="prodImages" placeholder="Or Image URLs (comma separated)" class="w-full p-2.5 border rounded-xl text-xs">

                    <input type="text" id="prodOptions" placeholder="Options (e.g. 500g, 1kg) comma separated" class="w-full p-2.5 border rounded-xl text-xs">
                    <input type="text" id="prodCategory" placeholder="Category Name" class="w-full p-2.5 border rounded-xl text-xs">
                    <button type="submit" id="saveProdBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow">Save Product</button>
                </form>
            </div>

            <div id="adminProductsList" class="grid grid-cols-2 gap-3">
                <p class="col-span-2 text-center text-gray-400 py-6 text-xs">Loading products...</p>
            </div>
        </div>

        <!-- TAB 3: CATEGORIES MANAGEMENT -->
        <div id="categoriesTab" class="admin-tab hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border space-y-3 shadow-sm">
                <h3 class="font-bold text-sm text-gray-800 border-b pb-2">Add Category</h3>
                <form onsubmit="handleAddCategory(event)" class="flex space-x-2">
                    <input type="text" id="catNameInput" placeholder="Category Name" class="flex-1 p-2.5 border rounded-xl text-xs" required>
                    <button type="submit" class="bg-blue-600 text-white font-bold px-4 rounded-xl text-xs">Add</button>
                </form>
            </div>
            <div id="adminCategoriesList" class="space-y-2"></div>
        </div>

    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYIQOX3FYTx1eN5Z-xD6dj8elfOilbbuU",
            authDomain: "pick-mart.firebaseapp.com",
            projectId: "pick-mart",
            storageBucket: "pick-mart.firebasestorage.app",
            messagingSenderId: "438637337844",
            appId: "1:438637337844:web:80734d96769e06fa6d12a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Password protection (Default: 1234)
        window.checkAdminPassword = function() {
            const pass = document.getElementById('adminPassInput').value;
            if(pass === "1234" || pass === "admin") {
                document.getElementById('adminAuthOverlay').classList.add('hidden');
                loadAdminOrders();
                loadAdminProducts();
                loadAdminCategories();
            } else {
                alert("Incorrect Password!");
            }
        };

        window.switchAdminTab = function(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn bg-white border text-gray-700 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap";
            });
            document.getElementById('btn-' + tabId).className = "tab-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap";
        };

        // Orders Management
        async function loadAdminOrders() {
            const list = document.getElementById('ordersList');
            try {
                const snap = await getDocs(collection(db, "orders"));
                if(snap.empty) return list.innerHTML = '<p class="text-center py-6 text-gray-400 text-xs">No orders found.</p>';
                list.innerHTML = '';
                snap.forEach(docSnap => {
                    const o = docSnap.data();
                    const id = docSnap.id;
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl border space-y-2 shadow-sm text-xs">
                            <div class="flex justify-between items-start border-b pb-2">
                                <div>
                                    <h4 class="font-bold text-sm text-gray-900">${o.productName}</h4>
                                    <p class="text-blue-600 font-bold">Amount: ₹${o.price} (${o.paymentMethod})</p>
                                    <p class="text-gray-400 text-[10px]">${o.orderDateFormatted || ''}</p>
                                </div>
                                <span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full">${o.status}</span>
                            </div>
                            <div class="space-y-1 text-gray-600">
                                <p><b>Customer:</b> ${o.name} (${o.phone})</p>
                                <p><b>Address:</b> ${o.address}</p>
                                ${o.gpsMapLink ? `<a href="${o.gpsMapLink}" target="_blank" class="text-blue-600 font-bold underline">📍 View Location on Map</a>` : ''}
                            </div>
                            ${o.paymentScreenshot ? `<div class="pt-2"><img src="${o.paymentScreenshot}" class="w-32 h-32 object-cover rounded border"></div>` : ''}
                            <div class="flex space-x-2 pt-2 border-t">
                                <input type="text" placeholder="Update Status (e.g. Shipped)" id="st-${id}" value="${o.status || ''}" class="p-1.5 border rounded flex-1">
                                <button onclick="updateOrderStatus('${id}')" class="bg-blue-600 text-white px-3 py-1 rounded font-bold">Update</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { list.innerHTML = '<p class="text-red-500 text-center py-4">Error loading orders</p>'; }
        }

        window.updateOrderStatus = async function(docId) {
            const statusVal = document.getElementById('st-' + docId).value;
            try {
                await updateDoc(doc(db, "orders", docId), { status: statusVal });
                alert("Order status updated!");
                loadAdminOrders();
            } catch(e) { alert("Error: " + e.message); }
        };

        // Multiple Image Compressor
        function compressMultipleImages(files) {
            return Promise.all(Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 600;
                            canvas.width = MAX_WIDTH;
                            canvas.height = Math.round((img.height * MAX_WIDTH) / img.width);
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        };
                    };
                });
            }));
        }

        // Products Management
        window.handleAddProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveProdBtn');
            btn.disabled = true;
            btn.innerText = "Processing Photos...";

            const name = document.getElementById('prodName').value;
            const price = Number(document.getElementById('prodPrice').value);
            const codPrice = Number(document.getElementById('prodCodPrice').value);
            const costPrice = Number(document.getElementById('prodCostPrice').value || 0);
            const options = document.getElementById('prodOptions').value;
            const category = document.getElementById('prodCategory').value;

            let images = [];
            const fileInput = document.getElementById('prodImageFiles');
            if (fileInput.files.length > 0) {
                images = await compressMultipleImages(fileInput.files);
            }

            const urlInput = document.getElementById('prodImages').value;
            if (urlInput.trim()) {
                const urlArray = urlInput.split(',').map(s => s.trim()).filter(Boolean);
                images = images.concat(urlArray);
            }

            if (images.length === 0) {
                alert("കുറഞ്ഞത് ഒരു ഫോട്ടോയെങ്കിലും സെലക്ട് ചെയ്യുക!");
                btn.disabled = false;
                btn.innerText = "Save Product";
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name, price, codPrice, costPrice, images, options, category, timestamp: new Date()
                });
                alert("Product Added Successfully!");
                e.target.reset();
                loadAdminProducts();
            } catch(err) {
                alert("Error adding product: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Product";
            }
        };

        async function loadAdminProducts() {
            const grid = document.getElementById('adminProductsList');
            try {
                const snap = await getDocs(collection(db, "products"));
                grid.innerHTML = '';
                snap.forEach(docSnap => {
                    const p = docSnap.data();
                    const id = docSnap.id;
                    const imgs = p.images && p.images.length > 0 ? p.images : [p.image];
                    const mainImg = imgs[0];
                    grid.innerHTML += `
                        <div class="bg-white p-2.5 rounded-xl border space-y-1.5 shadow-sm text-xs">
                            <img src="${mainImg}" class="w-full h-24 object-cover rounded">
                            <h4 class="font-bold line-clamp-1">${p.name}</h4>
                            <p class="text-blue-700 font-bold">₹${p.price} <span class="text-[10px] text-gray-500">(${imgs.length} photos)</span></p>
                            
                            <!-- INSTAGRAM LINK COPY BUTTON -->
                            <button onclick="copyInstaLink('${id}')" class="w-full bg-purple-50 text-purple-700 font-bold py-1 rounded border border-purple-200 text-[10px] flex items-center justify-center space-x-1">
                                <i class="fa-brands fa-instagram"></i> <span>Copy Insta Link</span>
                            </button>

                            <button onclick="deleteProduct('${id}')" class="w-full bg-red-50 text-red-600 font-bold py-1 rounded border border-red-200 text-[10px]">Delete</button>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        window.copyInstaLink = function(productId) {
            const link = `https://pickmart-store.github.io/Pick-Mart/?id=${productId}`;
            navigator.clipboard.writeText(link);
            alert("ഇൻസ്റ്റാഗ്രാം ലിങ്ക് കോപ്പി ചെയ്തു!\n\n" + link);
        };

        window.deleteProduct = async function(id) {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
            }
        };

        // Categories Management
        window.handleAddCategory = async function(e) {
            e.preventDefault();
            const name = document.getElementById('catNameInput').value;
            await addDoc(collection(db, "categories"), { name });
            document.getElementById('catNameInput').value = '';
            loadAdminCategories();
        };

        async function loadAdminCategories() {
            const list = document.getElementById('adminCategoriesList');
            const snap = await getDocs(collection(db, "categories"));
            list.innerHTML = '';
            snap.forEach(docSnap => {
                list.innerHTML += `<div class="bg-white p-2.5 rounded-xl border text-xs font-bold flex justify-between"><span>${docSnap.data().name}</span></div>`;
            });
        }
    </script>
</body>
</html>
