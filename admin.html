<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Mart Admin - Reselling Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div id="loginBox" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-10 text-center">
        <h2 class="text-xl font-bold mb-4">Pick Mart Admin Password</h2>
        <input type="password" id="pinInput" placeholder="Enter PIN" class="w-full p-2 border rounded mb-4 text-center">
        <button onclick="login()" class="w-full bg-purple-700 text-white font-bold py-2 rounded">Login</button>
    </div>

    <div id="adminBody" class="max-w-4xl mx-auto hidden space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded shadow">
            <h1 class="text-xl font-bold text-purple-800">🛒 Pick Mart Reseller Admin</h1>
            <button onclick="location.reload()" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Logout</button>
        </div>

        <!-- Add Product -->
        <div class="bg-white p-5 rounded shadow space-y-3">
            <h2 class="font-bold text-gray-700 border-b pb-2">1. പുതിയ പ്രൊഡക്റ്റ് ചേർക്കുക</h2>
            <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="pName" placeholder="Product Name" class="p-2 border rounded text-sm" required>
                <input type="number" id="pPrice" placeholder="Prepaid / Online Price (₹)" class="p-2 border rounded text-sm" required>
                <input type="number" id="pCodPrice" placeholder="COD Price (₹)" class="p-2 border rounded text-sm" required>
                <input type="text" id="pOptions" placeholder="Options e.g: Red, Blue OR S, M, L, XL" class="p-2 border rounded text-sm" required>
                <input type="number" id="pDeliveryDays" placeholder="Delivery Days (e.g. 4)" class="p-2 border rounded text-sm" required>
                <input type="number" id="pReturnDays" placeholder="Return Days (e.g. 7)" class="p-2 border rounded text-sm" required>
                <div class="md:col-span-2">
                    <label class="text-xs font-bold text-gray-500">Product Image</label>
                    <input type="file" id="pImgFile" accept="image/*" class="w-full p-2 border rounded bg-gray-50 text-sm" required>
                </div>
                <button type="submit" id="addBtn" class="md:col-span-2 bg-green-600 text-white font-bold py-2 rounded">Save Product</button>
            </form>
        </div>

        <!-- Product List & Copy Insta Link -->
        <div class="bg-white p-5 rounded shadow space-y-3">
            <h2 class="font-bold text-gray-700 border-b pb-2">2. പ്രൊഡക്റ്റുകളും ഇൻസ്റ്റാഗ്രാം ലിങ്കും</h2>
            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <!-- Manage Orders -->
        <div class="bg-white p-5 rounded shadow space-y-3">
            <h2 class="font-bold text-gray-700 border-b pb-2">3. വന്ന ഓർഡറുകളും ലൈവ് ട്രാക്കിംഗും</h2>
            <div id="ordersContainer" class="space-y-4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYIQOX3FYTx1eN5Z-xD6dj8elfOilbbuU",
            authDomain: "pick-mart.firebaseapp.com",
            projectId: "pick-mart",
            storageBucket: "pick-mart.firebasestorage.app",
            messagingSenderId: "438637337844",
            appId: "1:438637337844:web:80734d96769e66faed12a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.login = function() {
            if(document.getElementById('pinInput').value === "1234") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminBody').classList.remove('hidden');
                loadAdminData();
            } else { alert("Wrong PIN"); }
        };

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 500;
                        canvas.height = Math.round((img.height * 500) / img.width);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerText = "Saving...";

            try {
                const imgBase64 = await compressImage(document.getElementById('pImgFile').files[0]);
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('pName').value,
                    price: Number(document.getElementById('pPrice').value),
                    codPrice: Number(document.getElementById('pCodPrice').value),
                    options: document.getElementById('pOptions').value,
                    deliveryDays: document.getElementById('pDeliveryDays').value,
                    returnDays: document.getElementById('pReturnDays').value,
                    image: imgBase64
                });
                alert("പ്രൊഡക്റ്റ് ചേർത്തുകഴിഞ്ഞു!");
                document.getElementById('addProductForm').reset();
                loadAdminData();
            } catch(e) { alert("Error: " + e.message); }
            finally { btn.disabled = false; btn.innerText = "Save Product"; }
        });

        async function loadAdminData() {
            // Products List with Copy Direct Link
            const pDiv = document.getElementById('productList');
            pDiv.innerHTML = '';
            const pSnap = await getDocs(collection(db, "products"));
            pSnap.forEach(docSnap => {
                const p = docSnap.data();
                const directUrl = `https://nsivegetables-coder.github.io/?id=${docSnap.id}`;
                pDiv.innerHTML += `
                    <div class="border p-3 rounded bg-purple-50 flex space-x-3 items-center">
                        <img src="${p.image}" class="w-16 h-16 object-cover rounded">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs">${p.name}</h4>
                            <p class="text-xs text-purple-800">Prepaid: ₹${p.price} | COD: ₹${p.codPrice}</p>
                            <button onclick="navigator.clipboard.writeText('${directUrl}'); alert('Insta Direct Link Copied!')" class="mt-1 bg-purple-700 text-white text-[10px] px-2 py-1 rounded font-bold">
                                🔗 Copy Insta Link
                            </button>
                        </div>
                    </div>
                `;
            });

            // Orders List & Location Updater
            const oDiv = document.getElementById('ordersContainer');
            oDiv.innerHTML = '';
            const oSnap = await getDocs(collection(db, "orders"));
            oSnap.forEach(docSnap => {
                const o = docSnap.data();
                oDiv.innerHTML += `
                    <div class="border p-4 rounded bg-white space-y-2 border-purple-200">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-sm text-purple-900">${o.productName}</h4>
                            <span class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-bold">₹${o.price} (${o.paymentMethod})</span>
                        </div>
                        <p class="text-xs"><b>Customer:</b> ${o.name} | <b>Phone:</b> <a href="tel:${o.phone}" class="text-blue-600 underline">${o.phone}</a></p>
                        <p class="text-xs bg-gray-50 p-2 rounded"><b>Address:</b> ${o.address}</p>
                        
                        <!-- Status & Location Update Box -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 pt-2 border-t">
                            <select id="status-${docSnap.id}" class="p-1.5 border rounded text-xs font-bold">
                                <option value="Order Placed" ${o.status==='Order Placed'?'selected':''}>Order Placed</option>
                                <option value="Shipped / In Transit" ${o.status==='Shipped / In Transit'?'selected':''}>Shipped / In Transit</option>
                                <option value="Out for Delivery" ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option>
                                <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                            </select>
                            <input type="text" id="loc-${docSnap.id}" value="${o.currentLocation || ''}" placeholder="Live Location e.g. Kochi Hub" class="p-1.5 border rounded text-xs">
                            <button onclick="updateOrder('${docSnap.id}')" class="bg-purple-700 text-white text-xs font-bold py-1.5 rounded">Update Tracking</button>
                        </div>
                    </div>
                `;
            });
        }

        window.updateOrder = async function(id) {
            const status = document.getElementById(`status-${id}`).value;
            const location = document.getElementById(`loc-${id}`).value;
            try {
                await updateDoc(doc(db, "orders", id), {
                    status: status,
                    currentLocation: location
                });
                alert("ട്രാക്കിംഗ് സ്റ്റാറ്റസ് അപ്‌ഡേറ്റ് ചെയ്തു!");
            } catch(e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
